<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso — Elezioni Manduria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F2EC;
      --surface: #FFFFFF;
      --surface2: #EFECE5;
      --border: rgba(0,0,0,.09);
      --text: #1A1A18;
      --muted: #7A7870;
      --green: #2D6A4F;
      --green-l: #D8EDE3;
      --red: #C0392B;
      --red-l: #FCECEA;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 22px;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(45,106,79,.1);
    }

    input.error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(192,57,43,.08);
    }

    .toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      letter-spacing: .03em;
      padding: 3px 6px;
      line-height: 1;
      border-radius: 4px;
      transition: color .15s;
    }
    .toggle-pw:hover { color: var(--text); }

    .error-msg {
      display: none;
      font-size: 12px;
      color: var(--red);
      background: var(--red-l);
      border: 1px solid rgba(192,57,43,.15);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .error-msg.visible { display: block; }

    .btn {
      width: 100%;
      padding: 11px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn:hover  { background: #255c43; }
    .btn:active { transform: scale(.98); }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="login-card">
  <h1>Elezioni Comunali<br>Manduria</h1>
  <div class="subtitle">Inserisci la password per accedere ai dati</div>

  <form id="login-form" onsubmit="doLogin(event)">
    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" autofocus>
      <button type="button" class="toggle-pw" onclick="togglePw()" title="Mostra/nascondi" id="toggle-btn">Mostra</button>
    </div>

    <div class="error-msg" id="error-msg">
      Password errata. Riprova.
    </div>

    <button type="submit" class="btn">Accedi</button>
  </form>
</div>

<script>
  const PASSWORD = 'manduria';

  function doLogin(e) {
    e.preventDefault();
    const input = document.getElementById('password');
    const err   = document.getElementById('error-msg');

    if (input.value === PASSWORD) {
      sessionStorage.setItem('manduria_auth', '1');
      window.location.href = 'index.html';
    } else {
      input.classList.add('error');
      err.classList.add('visible');
      input.value = '';
      input.focus();
      setTimeout(() => {
        input.classList.remove('error');
      }, 1800);
    }
  }

  function togglePw() {
    const input = document.getElementById('password');
    const btn   = document.getElementById('toggle-btn');
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    btn.textContent = show ? 'Nascondi' : 'Mostra';
  }

  // Se già autenticato, vai direttamente
  if (sessionStorage.getItem('manduria_auth') === '1') {
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
